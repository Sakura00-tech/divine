<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posts | Divine Mercy</title><style>

:root{
  --navy:#b91c1c; --navy-dark:#7f1d1d; --gold:#dc2626; --gold-light:#fecaca;
  --bg:#fffafa; --white:#fff; --text:#333; --muted:#666; --border:#f1d5d5;
  --shadow:0 10px 30px rgba(185,28,28,.10); --radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
#navbar{
  position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;
  gap:20px;padding:14px 5%;background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);
  box-shadow:0 2px 12px rgba(0,0,0,.05)
}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy)}
.nav-logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(navy);color:var(gold);font-size:22px}
.nav-title{font-weight:700;font-size:14px}.nav-subtitle{font-size:12px;color:var(--muted)}
.nav-links{display:flex;gap:8px;align-items:center}
.nav-links a{padding:9px 12px;border-radius:9px;text-decoration:none;font-size:14px;color:var(--navy)}
.nav-links a:hover,.nav-links a.active{background:#fee2e2;color:var(--navy)}
#hamburger{display:none;border:0;background:transparent;color:var(--navy);padding:7px}
#hamburger span{display:block;width:24px;height:2px;background:var(--navy);margin:5px 0}
main{min-height:calc(100vh - 150px)}
.page-header{padding:70px 5% 40px;text-align:center;background:linear-gradient(135deg,#fff,#fff1f1)}
.section-eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.page-header h1{margin:8px 0;font-size:clamp(2rem,5vw,3.2rem);color:var(--navy)}
.page-header p{margin:0;color:var(--muted)}
.page-content{width:min(1100px,90%);margin:0 auto;padding:35px 0 70px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.search-input{width:min(420px,100%);padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;outline:none}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.cards-list{display:grid;gap:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card h3{color:var(--navy);margin:6px 0 10px}
.card p{color:#555}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eee;color:#444;margin-right:5px}
.badge-urgent{background:#fee2e2;color:#b91c1c}.badge-high{background:#fef3c7;color:#92400e}
.badge-normal{background:#dbeafe;color:#1d4ed8}.badge-low{background:#f3f4f6;color:#6b7280}
.badge-pending{background:#fef3c7;color:#92400e}.badge-confirmed{background:#dcfce7;color:#166534}
.badge-completed{background:#dbeafe;color:#1d4ed8}.badge-cancelled{background:#fee2e2;color:#b91c1c}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab-btn{border:1px solid var(--border);background:#fff;color:var(--navy);padding:8px 13px;border-radius:9px}
.tab-btn.active,.tab-btn:hover{background:var(--navy);color:#fff}
.booking-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.booking-type-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:.2s}
.booking-type-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.booking-type-icon{font-size:30px}.booking-type-card h4{margin:10px 0 4px;color:var(--navy)}.booking-type-card span{color:var(--gold);font-weight:700}
.divider{border:0;border-top:1px solid var(--border);margin:40px 0}
footer{background:var(--navy);color:#fff;text-align:center;padding:30px}
#toast-container{position:fixed;right:20px;bottom:20px;z-index:3000;display:grid;gap:8px}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:grid;place-items:center;padding:20px}
.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-header,.modal-footer{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border)}
.modal-footer{border-top:1px solid var(--border);border-bottom:0;justify-content:flex-end}
.modal-body{padding:22px}
.modal-close{border:0;background:transparent;font-size:20px}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.btn-primary{background:var(--navy);color:#fff}.btn-secondary{background:#eee;color:#333}.btn-danger{background:#fee2e2;color:#b91c1c}.btn-sm{font-size:12px}
.form-group{margin-bottom:15px}.form-group label{display:block;font-weight:700;font-size:13px;color:var(--navy);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;outline:none}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--gold)}
.booking-modal,.receipt-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2500;display:none;align-items:center;justify-content:center;padding:20px}
.booking-modal.show,.receipt-modal.show{display:flex}
.booking-form-container,.receipt-container{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:28px;position:relative}
.modal-close,.receipt-close{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:28px;color:#555}
.booking-form-header,.receipt-header{text-align:center;margin-bottom:22px}.modal-service-icon,.receipt-cross{font-size:34px}
.booking-total{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border);margin-top:10px}
.submit-booking-btn{width:100%;border:0;background:var(--navy);color:#fff;padding:13px;border-radius:9px;font-weight:700}
#hero{position:relative;min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;text-align:center;background:
radial-gradient(circle at 50% 30%,rgba(220,38,38,.35),transparent 28%),linear-gradient(135deg,#7f1d1d,#dc2626 55%,#b91c1c)}
#hero .hero-overlay{position:absolute;inset:0;background:rgba(0,0,0,.22)}
#hero .hero-content{position:relative;z-index:2;width:min(900px,90%);color:#fff}
.hero-title{font-family:Georgia,serif;font-size:clamp(2.4rem,6vw,4.5rem);line-height:1.15;margin:0 0 18px}
.hero-subtitle{max-width:750px;margin:0 auto 28px;line-height:1.8;font-size:1.05rem}
.hero-cta{border:0;border-radius:40px;padding:14px 26px;background:var(--gold);color:#fff;font-weight:700}
#header-trigger{display:none}
.explore-page{background:#f8f6f2}.explore-page section{padding:70px 0}.container{width:min(1150px,92%);margin:auto}
.section-title{text-align:center;font-family:Georgia,serif;font-size:2.4rem;margin:0 0 15px;color:var(--navy)}
.section-sub{text-align:center;color:#666;margin:0 auto 45px;max-width:850px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px}
.explore-card{background:#fff;padding:30px;border-radius:18px;box-shadow:var(--shadow);transition:.2s}.explore-card:hover{transform:translateY(-5px)}
.explore-card h3{font-family:Georgia,serif;color:var(--navy)}.icon{font-size:2.4rem}
.timeline{border-left:4px solid var(--gold);padding-left:28px;max-width:850px;margin:auto}.timeline-item{margin-bottom:35px}.timeline-item h4{color:var(--navy)}
.quote{background:var(--navy);color:#fff;text-align:center;padding:70px 20px}.quote h2{font-family:Georgia,serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;text-align:center}.stat{background:#fff;padding:25px;border-radius:15px;box-shadow:var(--shadow)}.stat h2{color:var(--gold)}
.prayer-box{background:#fff;border-radius:16px;padding:25px;margin:15px 0;box-shadow:var(--shadow)}
@media(max-width:760px){
  #navbar{padding:12px 4%}.nav-links{display:none;position:absolute;left:0;right:0;top:73px;background:#fff;padding:10px 4%;border-bottom:1px solid var(--border);flex-direction:column;align-items:stretch}
  .nav-links.open{display:flex}#hamburger{display:block}.nav-links a{text-align:center}
  .page-header{padding:50px 5% 30px}.page-content{width:92%}.booking-types{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){.booking-types{grid-template-columns:1fr}.booking-form-container,.receipt-container{padding:20px}}


</style>

<body data-page="posts">
<nav id="navbar"><a class="nav-brand" href="index.html"><div class="nav-logo">✝</div><div><div class="nav-title">The National Shrine and Parish</div><div class="nav-subtitle">The Divine Mercy</div></div></a><div class="nav-links" id="nav-links"><a href="index.html">Home</a><a href="announcements.html">Announcements</a><a href="schedule.html">Schedule</a><a class="active" href="posts.html">Posts</a><a href="bookings.html">Bookings</a></div><button id="hamburger" onclick="toggleMenu()" aria-label="Open menu"><span></span><span></span><span></span></button></nav>
<main><header class="page-header"><div class="section-eyebrow">Social Media</div><h1>Parish Posts</h1><p>Manage and schedule social media content</p></header><section class="page-content"><div class="toolbar"><div class="tabs" id="post-tabs"><button class="tab-btn" data-filter="published" onclick="switchPostTab('published')">Published</button></div></div><div id="posts-list" class="cards-list"></div></section></main><footer><strong>Divine Mercy</strong><br>Jesus, I trust in You.</footer><div id="toast-container"></div><script>
const STORAGE_KEY = "dm_church_data";
let state = { announcements: [], schedule: [], posts: [], bookings: [] };
let scheduleFilter = "all";
let postFilter = "all";
let bookingFilter = "all";
let announcementSearch = "";

function seedData() {
  const now = new Date();
  const date = (days) => {
    const value = new Date(now);
    value.setDate(value.getDate() + days);
    return value.toISOString().slice(0, 10);
  };
  const dateTime = (days) => {
    const value = new Date(now);
    value.setDate(value.getDate() + days);
    return value.toISOString().slice(0, 16);
  };
  state.announcements = [
    { id: 1, title: "Divine Mercy Sunday Celebration", content: "Join us for a special celebration of Divine Mercy Sunday. The Chaplet of Divine Mercy will be prayed at 3:00 PM, followed by Benediction and special prayers for all the faithful. All are welcome.", priority: "urgent", expiresAt: date(7), createdAt: now.toISOString() },
    { id: 2, title: "Parish Feast Day — First Friday Devotion", content: "Every First Friday of the month, we celebrate a special Mass in honor of the Sacred Heart of Jesus at 7:00 AM. Confessions are available from 6:00 AM.", priority: "high", expiresAt: null, createdAt: now.toISOString() },
    { id: 3, title: "Religious Education Classes Resume", content: "Our parish Religious Education program resumes this coming Saturday. Classes are held for children aged 6–16. Please register at the parish office for more information.", priority: "normal", expiresAt: null, createdAt: now.toISOString() },
  ];
  state.schedule = [
    { id: 1, title: "Sunday Mass", eventType: "mass", description: "Regular Sunday Parish Mass. Mass times: 7:00 AM, 9:00 AM, and 6:00 PM.", startDateTime: dateTime(3), endDateTime: "", location: "Main Church", celebrant: "Fr. Emmanuel Santos", isRecurring: true, createdAt: now.toISOString() },
    { id: 2, title: "Chaplet of Divine Mercy", eventType: "novena", description: "The Chaplet of Divine Mercy is prayed every day at 3:00 PM — the Hour of Mercy.", startDateTime: dateTime(1), endDateTime: "", location: "Chapel of Adoration", celebrant: "", isRecurring: true, createdAt: now.toISOString() },
    { id: 3, title: "Sacrament of Confession", eventType: "confession", description: "The Sacrament of Reconciliation is available every Saturday from 6:00 AM to 8:00 AM.", startDateTime: dateTime(4), endDateTime: "", location: "Confessional", celebrant: "Fr. Emmanuel Santos", isRecurring: true, createdAt: now.toISOString() },
    { id: 4, title: "First Friday Mass & Sacred Heart Devotion", eventType: "special_mass", description: "Special Mass in honor of the Sacred Heart of Jesus, followed by exposition and adoration.", startDateTime: dateTime(5), endDateTime: "", location: "Main Church", celebrant: "Fr. Emmanuel Santos", isRecurring: true, createdAt: now.toISOString() },
  ];
  state.posts = [
    { id: 1, content: "\"Jesus, I trust in You.\" — Let us hold fast to these words of St. Faustina as we enter this week with hearts open to God’s infinite mercy.", status: "published", platforms: ["facebook", "instagram"], scheduledAt: "", publishedAt: now.toISOString(), createdAt: now.toISOString() },
    { id: 2, content: "Join us for the Chaplet of Divine Mercy at 3:00 PM today. All are welcome in the chapel.", status: "scheduled", platforms: ["facebook", "twitter"], scheduledAt: dateTime(2), publishedAt: "", createdAt: now.toISOString() },
    { id: 3, content: "Parish family, please remember our Religious Education students in your prayers.", status: "draft", platforms: ["instagram"], scheduledAt: "", publishedAt: "", createdAt: now.toISOString() },
  ];
  state.bookings = [
    { id: 1, type: "baptism", subject: "Baby Gabriela Santos", preferredDate: date(14), alternateDate: date(21), notes: "Family would prefer a Sunday morning.", status: "pending", adminNotes: "", createdAt: now.toISOString() },
    { id: 2, type: "mass_request", subject: "Thanksgiving for healing", preferredDate: date(5), alternateDate: "", notes: "Please include the family intention.", status: "confirmed", adminNotes: "Confirmed for the 7:00 AM Mass.", createdAt: now.toISOString() },
    { id: 3, type: "wedding", subject: "Miguel & Elena", preferredDate: date(45), alternateDate: date(52), notes: "Initial consultation requested.", status: "completed", adminNotes: "Consultation completed.", createdAt: now.toISOString() },
  ];
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
    else {
      seedData();
      save();
    }
  } catch {
    seedData();
  }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function nextId(items) { return items.length ? Math.max(...items.map((item) => Number(item.id))) + 1 : 1; }
function esc(value) {
  return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function formatDate(value) {
  return value ? new Date(value).toLocaleDateString("en-PH", { year: "numeric", month: "short", day: "numeric" }) : "—";
}
function formatDateTime(value) {
  return value ? new Date(value).toLocaleDateString("en-PH", { weekday: "short", year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
}
function badge(text, className) { return `<span class="badge badge-${className}">${text}</span>`; }
function statusBadge(status) { return badge(status.charAt(0).toUpperCase() + status.slice(1).replace("_", " "), status); }
function priorityBadge(priority) {
  const labels = { urgent: "🔴 Urgent", high: "🟡 High", normal: "🔵 Normal", low: "⚪ Low" };
  return badge(labels[priority] || priority, priority);
}
function eventBadge(type) {
  const labels = { mass: "✝ Mass", event: "📆 Event", special_mass: "⭐ Special Mass", novena: "📿 Novena", confession: "🕊️ Confession", other: "Other" };
  return badge(labels[type] || type, type);
}
function bookingTypeBadge(type) {
  const labels = { baptism: "💧 Baptism", burial: "🕊️ Burial", wedding: "💍 Wedding", thanksgiving_mass: "🙏 Thanksgiving Mass", mass_request: "📜 Mass Request", souls_mass: "⭐ Souls Mass", other: "Other" };
  return badge(labels[type] || type, "mass");
}
function platformBadges(platforms) {
  const icons = { facebook: "📘", instagram: "📷", twitter: "🐦" };
  return (platforms || []).map((platform) => badge(`${icons[platform] || ""} ${platform.charAt(0).toUpperCase()}${platform.slice(1)}`, platform)).join("");
}
function toggleMenu() { document.querySelector("#nav-links").classList.toggle("open"); }
function toast(message) {
  let container = document.querySelector("#toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    document.body.append(container);
  }
  const item = document.createElement("div");
  item.className = "toast";
  item.textContent = message;
  container.append(item);
  setTimeout(() => item.remove(), 3200);
}
function closeModal() {
  const modal = document.querySelector(".modal-overlay.open");
  if (modal) modal.remove();
  document.body.style.overflow = "";
}
function openModal(title, body, saveLabel = "Save") {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay open";
  overlay.innerHTML = `<div class="modal"><div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="modal-save">${saveLabel}</button></div></div>`;
  overlay.addEventListener("click", (event) => { if (event.target === overlay) closeModal(); });
  document.body.append(overlay);
  document.body.style.overflow = "hidden";
  return overlay;
}
function formInput(label, id, value = "", type = "text", placeholder = "") {
  return `<div class="form-group"><label>${label}</label><input class="form-control" id="${id}" type="${type}" value="${esc(value)}" placeholder="${placeholder}"></div>`;
}
function formTextarea(label, id, value = "", placeholder = "") {
  return `<div class="form-group"><label>${label}</label><textarea class="form-control" id="${id}" placeholder="${placeholder}">${esc(value)}</textarea></div>`;
}
function formSelect(label, id, options, selected) {
  const choices = options.map(([value, label]) => `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`).join("");
  return `<div class="form-group"><label>${label}</label><select class="form-control" id="${id}">${choices}</select></div>`;
}

function openAnnouncementModal(id) {
  const item = state.announcements.find((entry) => entry.id === id) || {};
  const body = [
    formInput("Title *", "ann-title", item.title || "", "text", "Announcement title"),
    formTextarea("Content *", "ann-content", item.content || "", "Announcement message…"),
    `<div class="form-row">${formSelect("Priority", "ann-priority", [["normal", "Normal"], ["low", "Low"], ["high", "High"], ["urgent", "Urgent"]], item.priority || "normal")}${formInput("Expires At (optional)", "ann-expires", item.expiresAt || "", "date")}</div>`,
  ].join("");
  const modal = openModal(id ? "Edit Announcement" : "New Announcement", body);
  modal.querySelector("#modal-save").onclick = () => {
    const title = modal.querySelector("#ann-title").value.trim();
    const content = modal.querySelector("#ann-content").value.trim();
    if (!title || !content) return toast("Please fill in title and content.");
    const data = { title, content, priority: modal.querySelector("#ann-priority").value, expiresAt: modal.querySelector("#ann-expires").value || null };
    if (id) Object.assign(item, data);
    else state.announcements.unshift({ id: nextId(state.announcements), ...data, createdAt: new Date().toISOString() });
    save(); closeModal(); renderAnnouncements(); toast(id ? "Announcement updated." : "Announcement created.");
  };
}
function renderAnnouncements() {
  const list = document.querySelector("#announcements-list");
  if (!list) return;
  const query = announcementSearch.toLowerCase();
  const items = state.announcements.filter((item) => !query || item.title.toLowerCase().includes(query) || item.content.toLowerCase().includes(query));
  if (!items.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📢</div><h3>No announcements found</h3><p>Click “New Announcement” to create one.</p></div>`;
    return;
  }
  list.innerHTML = items.map((item) => `<div class="card"><div class="card-body"><div class="meta-row">${priorityBadge(item.priority)}<span class="meta-item">📅 ${formatDate(item.createdAt)}</span>${item.expiresAt ? `<span class="meta-item">⏳ Expires ${formatDate(item.expiresAt)}</span>` : ""}</div><h3 style="font-size:1.1rem;color:var(--navy);margin-bottom:.5rem">${esc(item.title)}</h3><p style="font-size:.88rem;color:var(--muted);line-height:1.65">${esc(item.content)}</p><div class="card-actions"></div></div></div>`).join("");
}
function deleteAnnouncement(id) {
  if (!confirm("Delete this announcement?")) return;
  state.announcements = state.announcements.filter((item) => item.id !== id);
  save(); renderAnnouncements(); toast("Announcement deleted.");
}

function openScheduleModal(id) {
  const item = state.schedule.find((entry) => entry.id === id) || {};
  const body = [
    formInput("Title *", "sch-title", item.title || "", "text", "Event title"),
    formTextarea("Description", "sch-description", item.description || "", "Event description"),
    `<div class="form-row">${formSelect("Event Type", "sch-type", [["mass", "Mass"], ["event", "Event"], ["special_mass", "Special Mass"], ["novena", "Novena"], ["confession", "Confession"], ["other", "Other"]], item.eventType || "event")}${formInput("Start Date & Time *", "sch-start", item.startDateTime || "", "datetime-local")}</div>`,
    `<div class="form-row">${formInput("End Date & Time", "sch-end", item.endDateTime || "", "datetime-local")}${formInput("Location", "sch-location", item.location || "", "text", "Main Church")}</div>`,
    formInput("Celebrant", "sch-celebrant", item.celebrant || "", "text", "Priest or leader"),
  ].join("");
  const modal = openModal(id ? "Edit Schedule Event" : "Add Schedule Event", body);
  modal.querySelector("#modal-save").onclick = () => {
    const title = modal.querySelector("#sch-title").value.trim();
    const startDateTime = modal.querySelector("#sch-start").value;
    if (!title || !startDateTime) return toast("Please fill in the title and start date.");

   ========================================= */

let editingBookingId = null;


/* =========================================
   OPEN BOOKING FORM
   ========================================= */

function openBookingModal(serviceType, bookingId = null) {

    const modal =
        document.getElementById("booking-modal");

    const form =
        document.getElementById("booking-form");

    const serviceInput =
        document.getElementById("booking-service");

    const serviceName =
        document.getElementById("modal-service-name");

    const serviceIcon =
        document.getElementById("modal-service-icon");

    const amount =
        document.getElementById("booking-amount");

    const dateInput =
        document.getElementById("booking-date");


    if (!modal || !form) {
        console.error(
            "Booking modal/form not found."
        );
        return;
    }


    /* =========================================
       MANAGE / EDIT EXISTING BOOKING
       ========================================= */

    if (bookingId !== null && bookingId !== undefined) {

        const booking =
            state.bookings.find(
                b => String(b.id) === String(bookingId)
            );


        if (!booking) {

            toast(
                "Booking could not be found."
            );

            return;

        }


        editingBookingId = booking.id;


        /* Fill existing data */

        const selectedService =
            serviceData[
                booking.serviceType ||
                booking.type
            ];


        if (serviceInput) {

            serviceInput.value =
                booking.serviceType ||
                booking.type ||
                "";

        }


        if (serviceName) {

            serviceName.textContent =
                booking.service ||
                selectedService?.name ||
                "Service";

        }


        if (serviceIcon) {

            serviceIcon.textContent =
                booking.icon ||
                selectedService?.icon ||
                "📋";

        }


        if (amount) {

            amount.textContent =
                formatBookingCurrency(
                    booking.amount ||
                    selectedService?.amount ||
                    0
                );

        }


        /* Fill name */

        const nameInput =
            document.getElementById(
                "booking-name"
            );

        if (nameInput) {

            nameInput.value =
                booking.name ||
                booking.subject ||
                "";

        }


        /* Fill date */

        if (dateInput) {

            dateInput.value =
                booking.date ||
                booking.preferredDate ||
                "";

        }


        /* Fill contact */

        const contactInput =
            document.getElementById(
                "booking-contact"
            );

        if (contactInput) {

            contactInput.value =
                booking.contact ||
                "";

        }


        /* Fill email */

        const emailInput =
            document.getElementById(
                "booking-email"
            );

        if (emailInput) {

            emailInput.value =
                booking.email ||
                "";

        }


        /* Fill notes */

        const notesInput =
            document.getElementById(
                "booking-notes"
            );

        if (notesInput) {

            notesInput.value =
                booking.notes ||
                "";

        }


    } else {

        /* =========================================
           NEW BOOKING
           ========================================= */

        editingBookingId = null;

        form.reset();


        const service =
            serviceData[serviceType];


        if (!service) {

            console.error(
                "Service not found:",
                serviceType
            );

            return;

        }


        if (serviceInput) {

            serviceInput.value =
                serviceType;

        }


        if (serviceName) {

            serviceName.textContent =
                service.name;

        }


        if (serviceIcon) {

            serviceIcon.textContent =
                service.icon;

        }


        if (amount) {

            amount.textContent =
                formatBookingCurrency(
                    service.amount
                );

        }

    }


    /* =========================================
       PREVENT PREVIOUS DATES
       ========================================= */

    if (dateInput) {

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                today.getDate()
            ).padStart(2, "0");


        dateInput.min =
            `${year}-${month}-${day}`;

    }


    /* =========================================
       SHOW MODAL
       ========================================= */

    modal.classList.add("show");

    document.body.style.overflow =
        "hidden";

}

function manageBooking(bookingId) {

    if (
        bookingId === null ||
        bookingId === undefined
    ) {

        toast(
            "Invalid booking."
        );

        return;

    }


    const booking =
        state.bookings.find(
            b => String(b.id) === String(bookingId)
        );


    if (!booking) {

        toast(
            "Booking not found."
        );

        return;

    }


    openBookingModal(
        booking.serviceType ||
        booking.type,
        booking.id
    );

}


/* =========================================
   DELETE BOOKING
   ========================================= */

function deleteBooking(bookingId) {

    if (
        bookingId === null ||
        bookingId === undefined
    ) {

        toast(
            "Invalid booking."
        );

        return;

    }


    const bookingIndex =
        state.bookings.findIndex(
            b =>
                String(b.id) ===
                String(bookingId)
        );


    if (bookingIndex === -1) {

        toast(
            "Booking not found."
        );

        return;

    }


    const booking =
        state.bookings[bookingIndex];


    const confirmed =
        window.confirm(
            "Are you sure you want to delete this booking?\n\n" +
            "Reference: " +
            (booking.reference || "N/A") +
            "\nService: " +
            (booking.service || "N/A")
        );


    if (!confirmed) {

        return;

    }


    /* Remove booking */

    state.bookings.splice(
        bookingIndex,
        1
    );


    /* Save */

    save();


    /* Refresh booking request */

    if (
        typeof renderBookings ===
        "function"
    ) {

        renderBookings();

    }


    /* Close modal if open */

    closeBookingModal();


    toast(
        "Booking deleted successfully."
    );

}


/* =========================================
   SUBMIT BOOKING / UPDATE BOOKING
   ========================================= */

function submitBooking(event) {

    if (event) {

        event.preventDefault();

    }


    const serviceType =
        document.getElementById(
            "booking-service"
        )?.value;


    const service =
        serviceData[serviceType];


    if (!service) {

        toast(
            "Please select a booking service."
        );

        return false;

    }


    const name =
        document.getElementById(
            "booking-name"
        )?.value.trim() || "";


    const date =
        document.getElementById(
            "booking-date"
        )?.value || "";


    const contact =
        document.getElementById(
            "booking-contact"
        )?.value.trim() || "";


    const email =
        document.getElementById(
            "booking-email"
        )?.value.trim() || "";


    const notes =
        document.getElementById(
            "booking-notes"
        )?.value.trim() || "";


    /* =========================================
       VALIDATION
       ========================================= */

    if (!name) {

        toast(
            "Please enter your full name."
        );

        return false;

    }


    if (!date) {

        toast(
            "Please select your preferred date."
        );

        return false;

    }


    if (!contact) {

        toast(
            "Please enter your contact number."
        );

        return false;

    }


    /* =========================================
       MANAGE / UPDATE EXISTING BOOKING
       ========================================= */

    if (
        editingBookingId !== null &&
        editingBookingId !== undefined
    ) {

        const booking =
            state.bookings.find(
                b =>
                    String(b.id) ===
                    String(editingBookingId)
            );


        if (!booking) {

            toast(
                "Booking not found."
            );

            editingBookingId = null;

            return false;

        }


        /* Preserve original booking information */

        booking.type =
            serviceType;

        booking.serviceType =
            serviceType;

        booking.service =
            service.name;

        booking.icon =
            service.icon;

        booking.subject =
            name;

        booking.name =
            name;

        booking.preferredDate =
            date;

        booking.date =
            date;

        booking.contact =
            contact;

        booking.email =
            email;

        booking.notes =
            notes;

        booking.amount =
            service.amount;


        /*
         * IMPORTANT:
         * Do not change:
         * id
         * reference
         * status
         * createdAt
         */


        save();


        if (
            typeof renderBookings ===
            "function"
        ) {

            renderBookings();

        }


        closeBookingModal();


        toast(
            "Booking updated successfully."
        );


        editingBookingId = null;


        return false;

    }


    /* =========================================
       CREATE NEW BOOKING
       ========================================= */

    const booking = {

        id:
            nextId(
                state.bookings
            ),

        reference:
            generateBookingReference(),

        type:
            serviceType,

        service:
            service.name,

        serviceType:
            serviceType,

        icon:
            service.icon,

        subject:
            name,

        name:
            name,

        preferredDate:
            date,

        date:
            date,

        contact:
            contact,

        email:
            email,

        notes:
            notes,

        amount:
            service.amount,

        status:
            "pending",

        adminNotes:
            "",

        createdAt:
            new Date().toISOString()

    };


    /* Add new booking */

    state.bookings.unshift(
        booking
    );


    /* Save */

    save();


    /* Reset edit state */

    editingBookingId = null;


    /* Close booking form */

    closeBookingModal();


    /* Refresh booking list */

    if (
        typeof renderBookings ===
        "function"
    ) {

        renderBookings();

    }


    /* Notification */

    toast(
        "Booking request submitted successfully."
    );


    /* =========================================
       SHOW TRANSACTION RECEIPT
       ========================================= */

    setTimeout(
        function () {

            showTransactionReceipt(
                booking
            );

        },
        100
    );


    return false;

}

/* =========================================
   GENERATE REFERENCE NUMBER
   ========================================= */

function generateBookingReference() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    const random =
        Math.floor(
            100000 +
            Math.random() * 900000
        );


    return (
        "DM-" +
        year +
        month +
        day +
        "-" +
        random
    );

}

}


/* =========================================
   SHOW RECEIPT FOR EXISTING BOOKING
   ========================================= */

function viewBookingReceipt(bookingId) {

    const booking =
        state.bookings.find(
            b =>
                String(b.id) ===
                String(bookingId)
        );


    if (!booking) {

        toast(
            "Booking not found."
        );

        return;

    }


    showTransactionReceipt(
        booking
    );

}


/* =========================================
   BOOKING CURRENCY
   ========================================= */

function formatBookingCurrency(
    amount
) {

    return new Intl.NumberFormat(
        "en-PH",
        {
            style: "currency",
            currency: "PHP"
        }
    ).format(
        Number(amount) || 0
    );

}


/* =========================================
   BOOKING DATE
   ========================================= */

function formatBookingDate(
    value
) {

    if (!value) {

        return "—";

    }


    const parts =
        value.split("-");


    if (
        parts.length !== 3
    ) {

        return value;

    }


    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    return date.toLocaleDateString(
        "en-PH",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/* =========================================
   MODAL EVENTS
   ========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        /* =====================================
           BOOKING FORM
           ===================================== */

        const form =
            document.getElementById(
                "booking-form"
            );


        if (form) {

            /*
             * Remove duplicate submit listener
             * if this script is loaded more than once.
             */

            form.onsubmit =
                submitBooking;

        }


        /* =====================================
           BOOKING MODAL
           ===================================== */

        const bookingModal =
            document.getElementById(
                "booking-modal"
            );


        if (bookingModal) {

            bookingModal.addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        bookingModal
                    ) {

                        closeBookingModal();

                    }

                }
            );

        }


        /* =====================================
           RECEIPT MODAL
           ===================================== */

        const receiptModal =
            document.getElementById(
                "receipt-modal"
            );


        if (receiptModal) {

            receiptModal.addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        receiptModal
                    ) {

                        closeReceipt();

                    }

                }
            );

        }

    }
);


/* =========================================
   ESC KEY
   ========================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeBookingModal();

            closeReceipt();

        }

    }
);
</script>
