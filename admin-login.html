<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Divine Mercy</title>
<style>
/* =====================================================
   DIVINE MERCY ADMIN PANEL
===================================================== */

:root {
    --navy: #b91c1c;
    --navy-dark: #7f1d1d;
    --gold: #b91c1c;
    --gold-light: #fecaca;

    --white: #ffffff;
    --background: #f4f6fa;
    --card: #ffffff;

    --text: #1f2937;
    --muted: #6b7280;

    --border: #e5e7eb;

    --success: #15803d;
    --success-bg: #dcfce7;

    --warning: #b45309;
    --warning-bg: #fef3c7;

    --danger: #b91c1c;
    --danger-bg: #fee2e2;

    --info: #1d4ed8;
    --info-bg: #dbeafe;

    --shadow:
        0 8px 25px rgba(15, 35, 63, 0.08);

    --radius: 14px;
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background: var(--background);
    color: var(--text);
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =====================================================
   LOGIN PAGE
===================================================== */

.login-page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(8, 24, 44, 0.98),
            rgba(16, 35, 63, 0.95)
        );

    padding: 20px;
}


.login-container {
    width: 100%;
    max-width: 430px;
}


.login-card {
    background: var(--white);

    border-radius: 24px;

    padding: 42px 36px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.28);

    text-align: center;
}


.login-logo {
    width: 76px;
    height: 76px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: var(navy);
    color: var(gold);

    font-size: 34px;

    border: 4px solid var(--gold-light);
}


.login-card h1 {
    margin: 0;

    color: var(--navy);

    font-size: 28px;
}


.login-subtitle {
    margin:
        10px
        0
        28px;

    color: var(--muted);

    line-height: 1.6;

    font-size: 14px;
}


.input-group {
    text-align: left;

    margin-bottom: 18px;
}


.input-group label {
    display: block;

    margin-bottom: 7px;

    color: var(--navy);

    font-size: 14px;
    font-weight: 700;
}


.input-group input {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid var(--border);

    border-radius: 10px;

    outline: none;

    font-size: 15px;

    transition: 0.2s;
}


.input-group input:focus {
    border-color: var(--gold);

    box-shadow:
        0 0 0 3px rgba(201, 162, 39, 0.12);
}


.password-wrapper {
    position: relative;
}


.password-wrapper input {
    padding-right: 70px;
}


.password-toggle {
    position: absolute;

    right: 8px;
    top: 50%;

    transform: translateY(-50%);

    border: 0;
    background: transparent;

    color: var(--navy);

    font-size: 12px;
    font-weight: 700;
}


.login-button {
    width: 100%;

    margin-top: 8px;

    padding: 14px;

    border: none;
    border-radius: 10px;

    background: var(--navy);
    color: white;

    font-size: 15px;
    font-weight: 700;

    transition: 0.2s;
}


.login-button:hover {
    background: var(--navy-dark);

    transform: translateY(-1px);
}


.login-error {
    display: none;

    margin-bottom: 18px;

    padding: 11px;

    border-radius: 9px;

    background: var(--danger-bg);
    color: var(--danger);

    font-size: 13px;
}


.back-home {
    display: inline-block;

    margin-top: 22px;

    color: var(--navy);

    text-decoration: none;

    font-size: 13px;
    font-weight: 700;
}


/* =====================================================
   ADMIN LAYOUT
===================================================== */

.admin-layout {
    min-height: 100vh;

    display: flex;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 260px;

    display: flex;
    flex-direction: column;

    background: var(--navy);

    color: white;

    z-index: 1000;
}


.sidebar-brand {
    min-height: 90px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 18px 20px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
}


.sidebar-logo {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;

    color: var(--gold);

    font-size: 23px;
}


.brand-title {
    font-size: 16px;
    font-weight: 800;
}


.brand-subtitle {
    margin-top: 3px;

    color: rgba(255,255,255,0.65);

    font-size: 11px;
}


.sidebar-menu {
    padding: 18px 12px;
}


.menu-item {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 12px;

    margin-bottom: 5px;

    padding: 12px 14px;

    border: none;
    border-radius: 9px;

    background: transparent;

    color: rgba(255,255,255,0.72);

    text-align: left;

    font-size: 14px;

    transition: 0.2s;
}


.menu-item span {
    width: 23px;

    text-align: center;

    font-size: 17px;
}


.menu-item:hover {
    background:
        rgba(255,255,255,0.08);

    color: white;
}


.menu-item.active {
    background: var(--gold);

    color: var(--navy);

    font-weight: 800;
}


.sidebar-bottom {
    margin-top: auto;

    padding: 15px;

    border-top:
        1px solid
        rgba(255,255,255,0.08);
}


.sidebar-home,
.logout-button {
    width: 100%;

    display: block;

    padding: 11px;

    margin-bottom: 8px;

    border-radius: 9px;

    text-align: center;

    text-decoration: none;

    font-size: 13px;
    font-weight: 700;
}


.sidebar-home {
    color: white;

    background:
        rgba(255,255,255,0.08);
}


.logout-button {
    border: 1px solid
        rgba(255,255,255,0.15);

    background: transparent;

    color: #ffdddd;
}


.logout-button:hover {
    background: var(--danger);
    color: white;
}


/* =====================================================
   MAIN
===================================================== */

.admin-main {
    width: calc(100% - 260px);

    margin-left: 260px;

    min-height: 100vh;

    padding-bottom: 50px;
}


.admin-header {
    min-height: 90px;

    padding: 18px 32px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: white;

    border-bottom:
        1px solid
        var(--border);

    position: sticky;

    top: 0;

    z-index: 500;
}


.admin-header h1 {
    margin: 0;

    color: var(--navy);

    font-size: 25px;
}


.admin-header p {
    margin: 5px 0 0;

    color: var(--muted);

    font-size: 13px;
}


.admin-profile {
    display: flex;

    align-items: center;

    gap: 10px;
}


.admin-avatar {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: var(--navy);
    color: var(--gold);

    font-weight: 800;
}


.admin-profile strong,
.admin-profile small {
    display: block;
}


.admin-profile strong {
    font-size: 13px;

    color: var(--navy);
}


.admin-profile small {
    margin-top: 2px;

    color: var(--muted);

    font-size: 11px;
}


.mobile-menu {
    display: none;

    border: 0;

    background: transparent;

    font-size: 22px;
}


/* =====================================================
   SECTIONS
===================================================== */

.admin-section {
    display: none;

    padding: 30px 32px;
}


.admin-section.active {
    display: block;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome-card {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 30px;

    border-radius: var(--radius);

    background:
        linear-gradient(
            135deg,
            var(--navy),
            #1c3c68
        );

    color: white;

    box-shadow: var(--shadow);
}


.welcome-label {
    color: var(--gold-light);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 1.4px;
}


.welcome-card h2 {
    margin: 8px 0;

    font-size: 27px;
}


.welcome-card p {
    max-width: 650px;

    margin: 0;

    color: rgba(255,255,255,0.75);

    line-height: 1.6;

    font-size: 14px;
}


.welcome-icon {
    width: 90px;
    height: 90px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.1);

    border:
        2px solid
        rgba(255,255,255,0.25);

    color: var(--gold-light);

    font-size: 42px;
}


/* =====================================================
   STATISTICS
===================================================== */

.stats-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;

    margin-top: 22px;
}


.stat-card {
    display: flex;

    align-items: center;

    gap: 15px;

    padding: 20px;

    background: white;

    border:
        1px solid
        var(--border);

    border-radius: var(--radius);

    box-shadow: var(--shadow);
}


.stat-icon {
    width: 50px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: #f1f5f9;

    font-size: 23px;
}


.stat-card span,
.stat-card strong {
    display: block;
}


.stat-card span {
    color: var(--muted);

    font-size: 12px;
}


.stat-card strong {
    margin-top: 5px;

    color: var(--navy);

    font-size: 25px;
}


/* =====================================================
   SECTION TITLES
===================================================== */

.section-title-row {
    margin-top: 32px;

    display: flex;

    justify-content: space-between;
    align-items: center;
}


.section-title-row h2,
.content-header h2 {
    margin: 0;

    color: var(--navy);

    font-size: 20px;
}


.section-title-row p,
.content-header p {
    margin: 5px 0 0;

    color: var(--muted);

    font-size: 13px;
}


/* =====================================================
   BUTTONS
===================================================== */

.primary-button,
.secondary-button,
.danger-button {
    border-radius: 9px;

    padding: 10px 15px;

    font-size: 13px;

    font-weight: 700;

    transition: 0.2s;
}


.primary-button {
    border: none;

    background: var(--navy);
    color: white;
}


.primary-button:hover {
    background: var(--navy-dark);
}


.secondary-button {
    border:
        1px solid
        var(--border);

    background: white;

    color: var(--navy);
}


.secondary-button:hover {
    border-color: var(--gold);
}


.danger-button {
    border: none;

    background: var(--danger-bg);

    color: var(--danger);
}


.danger-button:hover {
    background: var(--danger);

    color: white;
}


/* =====================================================
   BOOKING OVERVIEW
===================================================== */

.booking-overview {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-top: 15px;
}


.overview-card {
    padding: 18px;

    border-radius: 12px;

    background: white;

    border: 1px solid var(--border);

    text-align: center;
}


.overview-card span,
.overview-card strong {
    display: block;
}


.overview-card span {
    font-size: 12px;

    color: var(--muted);
}


.overview-card strong {
    margin-top: 5px;

    font-size: 26px;
}


.overview-card.pending strong {
    color: var(--warning);
}


.overview-card.confirmed strong {
    color: var(--info);
}


.overview-card.completed strong {
    color: var(--success);
}


.overview-card.cancelled strong {
    color: var(--danger);
}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-top: 15px;
}


.quick-card {
    padding: 20px;

    border:
        1px solid
        var(--border);

    border-radius: 12px;

    background: white;

    text-align: left;

    box-shadow: var(--shadow);

    transition: 0.2s;
}


.quick-card:hover {
    transform: translateY(-3px);

    border-color: var(--gold);
}


.quick-card span,
.quick-card strong,
.quick-card small {
    display: block;
}


.quick-card span {
    margin-bottom: 10px;

    font-size: 25px;
}


.quick-card strong {
    color: var(--navy);

    font-size: 14px;
}


.quick-card small {
    margin-top: 6px;

    color: var(--muted);

    line-height: 1.5;

    font-size: 11px;
}


/* =====================================================
   CONTENT HEADER
===================================================== */

.content-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 20px;
}


/* =====================================================
   LIST
===================================================== */

.admin-list {
    display: grid;

    gap: 14px;
}


.admin-record {
    background: white;

    border:
        1px solid
        var(--border);

    border-radius: var(--radius);

    padding: 20px;

    box-shadow: var(--shadow);
}


.record-top {
    display: flex;

    justify-content: space-between;

    gap: 15px;

    align-items: flex-start;
}


.record-title {
    margin: 0;

    color: var(--navy);

    font-size: 17px;
}


.record-content {
    margin: 10px 0 0;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.65;
}


.record-meta {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 13px;
}


.meta {
    padding: 5px 8px;

    border-radius: 6px;

    background: #f1f5f9;

    color: var(--muted);

    font-size: 11px;
}


.record-actions {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 15px;

    padding-top: 14px;

    border-top:
        1px solid
        var(--border);
}


/* =====================================================
   BADGES
===================================================== */

.badge {
    display: inline-flex;

    align-items: center;

    padding: 5px 9px;

    border-radius: 999px;

    font-size: 10px;

    font-weight: 800;

    text-transform: capitalize;
}


.badge-pending {
    background: var(--warning-bg);
    color: var(--warning);
}


.badge-confirmed {
    background: var(--info-bg);
    color: var(--info);
}


.badge-completed {
    background: var(--success-bg);
    color: var(--success);
}


.badge-cancelled {
    background: var(--danger-bg);
    color: var(--danger);
}


.badge-published {
    background: var(--success-bg);
    color: var(--success);
}


.badge-scheduled {
    background: var(--info-bg);
    color: var(--info);
}


.badge-draft {
    background: #e5e7eb;
    color: #4b5563;
}


.badge-urgent {
    background: var(--danger-bg);
    color: var(--danger);
}


.badge-high {
    background: var(--warning-bg);
    color: var(--warning);
}


.badge-normal {
    background: var(--info-bg);
    color: var(--info);
}


.badge-low {
    background: #f1f5f9;
    color: var(--muted);
}


/* =====================================================
   BOOKING FILTER
===================================================== */

.booking-filter {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 18px;

    padding: 5px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 10px;

    width: fit-content;
}


.booking-filter-button {
    border: none;

    padding: 8px 13px;

    border-radius: 7px;

    background: transparent;

    color: var(--muted);

    font-size: 12px;

    font-weight: 700;
}


.booking-filter-button.active {
    background: var(--navy);

    color: white;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state {
    padding: 60px 20px;

    border:
        1px dashed
        #cbd5e1;

    border-radius: var(--radius);

    background: white;

    text-align: center;
}


.empty-state-icon {
    font-size: 35px;

    margin-bottom: 10px;
}


.empty-state h3 {
    margin: 0;

    color: var(--navy);
}


.empty-state p {
    color: var(--muted);

    font-size: 13px;
}


/* =====================================================
   MODAL
===================================================== */

.modal-container {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,0.55);

    z-index: 3000;
}


.modal-container.open {
    display: flex;
}


.admin-modal {
    width: 100%;
    max-width: 600px;

    max-height: 90vh;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    background: white;

    border-radius: 16px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.3);
}


.modal-header {
    display: flex;

    justify-content: space-between;

    gap: 15px;

    padding: 20px;

    border-bottom:
        1px solid
        var(--border);
}


.modal-header h2 {
    margin: 0;

    color: var(--navy);

    font-size: 19px;
}


.modal-header p {
    margin: 4px 0 0;

    color: var(--muted);

    font-size: 12px;
}


.modal-close {
    width: 34px;
    height: 34px;

    border: none;

    border-radius: 8px;

    background: #f1f5f9;

    color: var(--muted);

    font-size: 15px;
}


.modal-content {
    overflow-y: auto;

    padding: 22px;
}


.form-group {
    margin-bottom: 16px;
}


.form-group label {
    display: block;

    margin-bottom: 6px;

    color: var(--navy);

    font-size: 12px;
    font-weight: 800;
}


.form-control {
    width: 100%;

    padding: 11px 12px;

    border:
        1px solid
        var(--border);

    border-radius: 8px;

    outline: none;

    font-size: 13px;
}


.form-control:focus {
    border-color: var(--gold);

    box-shadow:
        0 0 0 3px
        rgba(201,162,39,0.1);
}


textarea.form-control {
    min-height: 120px;

    resize: vertical;
}


.modal-footer {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    padding: 16px 20px;

    border-top:
        1px solid
        var(--border);
}


/* =====================================================
   TOAST
===================================================== */

.admin-toast {
    position: fixed;

    right: 20px;
    bottom: 20px;

    max-width: 350px;

    padding: 13px 17px;

    border-radius: 9px;

    background: var(--navy);

    color: white;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.2);

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transform:
        translateY(15px);

    transition: 0.25s;

    z-index: 5000;
}


.admin-toast.show {
    opacity: 1;

    transform:
        translateY(0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1100px) {

    .stats-grid,
    .booking-overview {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .quick-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media (max-width: 800px) {

    .sidebar {
        transform:
            translateX(-100%);

        transition: 0.25s;
    }


    .sidebar.open {
        transform:
            translateX(0);
    }


    .admin-main {
        width: 100%;

        margin-left: 0;
    }


        .mobile-menu {
        display: block;
    }


    .admin-header {
        gap: 12px;

        padding:
            15px 18px;
    }


    .admin-header h1 {
        font-size: 20px;
    }


    .admin-profile {
        display: none;
    }


    .admin-section {
        padding:
            22px 18px;
    }


    .welcome-card {
        padding: 22px;
    }


    .welcome-icon {
        display: none;
    }

}


@media (max-width: 600px) {

    .login-card {
        padding: 32px 22px;
    }


    .stats-grid,
    .booking-overview,
    .quick-grid {
        grid-template-columns: 1fr;
    }


    .content-header,
    .section-title-row {
        align-items: flex-start;

        flex-direction: column;

        gap: 12px;
    }


    .record-top {
        flex-direction: column;
    }


    .record-actions {
        justify-content: stretch;
    }


    .record-actions button {
        flex: 1;
    }

}



/* RED INTERACTION + DARK RED FOOTER */
:root{--click-red:#b91c1c;--click-red-dark:#7f1d1d;--footer-red:#641010;}
button:active,a:active,.tab-btn:active,.btn:active,.password-toggle:active,#hamburger:active{color:var(--click-red) !important;}
.tab-btn.active,.tab-btn:hover{background:var(--click-red) !important;border-color:var(--click-red) !important;color:#fff !important;}
.btn-primary:active,.login-button:active{background:var(--click-red-dark) !important;}
footer{background:var(--footer-red) !important;color:#fff;}
</style>

<style>
/* FINAL RED THEME OVERRIDES */
:root{
