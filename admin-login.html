<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const STORAGE_KEY = "dm_church_data";

const ADMIN_USERNAME = "";
const ADMIN_PASSWORD = "";

const VIEWER_USERNAME = "";
const VIEWER_PASSWORD = "";

const LOGIN_KEY = "dm_admin_logged_in";
const ROLE_KEY = "dm_admin_role";


/* =====================================================
   DEFAULT DATA STRUCTURE
===================================================== */

const emptyState = {
    announcements: [],
    schedule: [],
    posts: [],
    bookings: []
};


/* =====================================================
   AUTHENTICATION
===================================================== */

function isAdminLoggedIn() {

    return sessionStorage.getItem(LOGIN_KEY) === "true";

}


function adminLogin() { return false; }


function adminLogout() {

    sessionStorage.removeItem(
        LOGIN_KEY
    );

        sessionStorage.removeItem(
        ROLE_KEY
    );

window.location.href =
        "admin-login.html";
}


/* =====================================================
   GET DATA
===================================================== */

function getState() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw) {

            return {
                ...emptyState
            };

        }

        const parsed =
            JSON.parse(raw);

        return {
            announcements:
                Array.isArray(parsed.announcements)
                    ? parsed.announcements
                    : [],

            schedule:
                Array.isArray(parsed.schedule)
                    ? parsed.schedule
                    : [],

            posts:
                Array.isArray(parsed.posts)
                    ? parsed.posts
                    : [],

            bookings:
                Array.isArray(parsed.bookings)
                    ? parsed.bookings
                    : []
        };

    } catch (error) {

        console.error(
            "Unable to read admin data:",
            error
        );

        return {
            ...emptyState
        };

    }

}


/* =====================================================
   SAVE DATA
===================================================== */

function saveState(state) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value) {

    if (!value) {
        return "—";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return escapeHTML(value);
    }

    return date.toLocaleDateString(
        "en-PH",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


function formatDateTime(value) {

    if (!value) {
        return "—";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return escapeHTML(value);
    }

    return date.toLocaleString(
        "en-PH",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

    const toast =
        document.getElementById(
            "admin-toast"
        );

    if (!toast) {
        return;
    }

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   LOGIN PAGE
===================================================== */

function initializeLogin() {

    const form =
        document.getElementById(
            "admin-login-form"
        );

    if (!form) {
        return;
    }


    if (isAdminLoggedIn()) {

        window.location.href =
            "admin.html";

        return;
    }


    const password =
        document.getElementById(
            "password"
        );

    const toggle =
        document.getElementById(
            "toggle-password"
        );


    if (toggle && password) {

        toggle.addEventListener(
            "click",
            () => {

                if (
                    password.type ===
                    "password"
                ) {

                    password.type =
                        "text";

                    toggle.textContent =
                        "Hide";

                } else {

                    password.type =
                        "password";

                    toggle.textContent =
                        "Show";

                }

            }
        );

    }


    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("username").value.trim();
        const passwordValue = password.value;
        const error = document.getElementById("login-error");
        const submit = form.querySelector('button[type="submit"],input[type="submit"]');
        if (submit) submit.disabled = true;
        error.style.display = "none";
        const result = await window.dmLogin(email, passwordValue);
        if (submit) submit.disabled = false;
        if (result.ok) {
            window.location.href = "admin.html";
            return;
        }
        error.textContent = result.message || "Unable to sign in.";
        error.style.display = "block";
    });

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

let currentSection =
    "dashboard";


function showSection(section) {

    currentSection =
        section;


    document
        .querySelectorAll(
            ".admin-section"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    const selected =
        document.getElementById(
            section + "-section"
        );


    if (selected) {

        selected.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(
            ".menu-item"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.section ===
                    section
                );

            }
        );


    updateHeader(section);


    if (section === "dashboard") {
        renderDashboard();
    }

    if (section === "announcements") {
        renderAnnouncements();
    }

    if (section === "schedule") {
        renderSchedule();
    }

    if (section === "posts") {
        renderPosts();
    }

    if (section === "bookings") {
        renderBookings();
    }


    const sidebar =
        document.getElementById(
            "sidebar"
        );

    if (sidebar) {
        sidebar.classList.remove(
            "open"
        );
    }

}


function updateHeader(section) {

    const title =
        document.getElementById(
            "page-title"
        );

    const description =
        document.getElementById(
            "page-description"
        );


    const information = {

        dashboard: [
            "Dashboard",
            "Welcome to the Divine Mercy administration panel."
        ],

        announcements: [
            "Announcements",
            "Manage parish announcements."
        ],

        schedule: [
            "Schedule",
            "Manage parish events and schedules."
        ],

        posts: [
            "Posts",
            "Manage parish social media posts."
        ],

        bookings: [
            "Bookings",
            "Manage parish booking requests."
        ]

    };


    const data =
        information[section] ||
        information.dashboard;


    title.textContent =
        data[0];

    description.textContent =
        data[1];

}


/* =====================================================
   DASHBOARD
===================================================== */

function renderDashboard() {

    const state =
        getState();


    document.getElementById(
        "stat-announcements"
    ).textContent =
        state.announcements.length;


    document.getElementById(
        "stat-schedule"
    ).textContent =
        state.schedule.length;


    document.getElementById(
        "stat-posts"
    ).textContent =
        state.posts.length;


    document.getElementById(
        "stat-bookings"
    ).textContent =
        state.bookings.length;


    const pending =
        state.bookings.filter(
            item =>
                item.status ===
                "pending"
        ).length;


    const confirmed =
        state.bookings.filter(
            item =>
                item.status ===
                "confirmed"
        ).length;


    const completed =
        state.bookings.filter(
            item =>
                item.status ===
                "completed"
        ).length;


    const cancelled =
        state.bookings.filter(
            item =>
                item.status ===
                "cancelled"
        ).length;


    document.getElementById(
        "stat-pending"
    ).textContent =
        pending;


    document.getElementById(
        "stat-confirmed"
    ).textContent =
        confirmed;


    document.getElementById(
        "stat-completed"
    ).textContent =
        completed;


    document.getElementById(
        "stat-cancelled"
    ).textContent =
        cancelled;

}


/* =====================================================
   ANNOUNCEMENTS
===================================================== */

function renderAnnouncements() {

    const container =
        document.getElementById(
            "admin-announcements"
        );


    if (!container) {
        return;
    }


    const state =
        getState();


    if (!state.announcements.length) {

        container.innerHTML =
            emptyHTML(
                "📢",
                "No announcements",
                "There are currently no announcements."
            );

        return;
    }


    container.innerHTML =
        state.announcements
            .map(
                item => {

                    const priority =
                        item.priority ||
                        "normal";


                    return `
                        <div class="admin-record">

                            <div class="record-top">

                                <div>

                                    <h3 class="record-title">
                                        ${escapeHTML(item.title || "Untitled Announcement")}
                                    </h3>

                                    <div class="record-meta">

                                        <span class="badge badge-${escapeHTML(priority)}">
                                            ${escapeHTML(priority)}
                                        </span>

                                        <span class="meta">
                                            Created ${formatDate(item.createdAt)}
                                        </span>

                                        ${
                                            item.expiresAt
                                                ? `<span class="meta">
                                                    Expires ${formatDate(item.expiresAt)}
                                                   </span>`
                                                : ""
                                        }

                                    </div>

                                </div>

                            </div>

                            <p class="record-content">
                                ${escapeHTML(item.content || "")}
                            </p>

                            <div class="record-actions">

                                <button
                                    class="secondary-button"
                                    onclick="editAnnouncement(${Number(item.id)})"
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    class="danger-button"
                                    onclick="deleteAnnouncement(${Number(item.id)})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>
                    `;

                }
            )
            .join("");

}


/* =====================================================
   EDIT ANNOUNCEMENT
===================================================== */

function editAnnouncement(id) {

    const state =
        getState();

    const item =
        state.announcements.find(
            entry =>
                Number(entry.id) ===
                Number(id)
        );


    if (!item) {

        showToast(
            "Announcement not found."
        );

        return;
    }


    openModal(
        "Edit Announcement",
        "Update the announcement information.",
        `
            <div class="form-group">

                <label>
                    Title
                </label>

                <input
                    id="edit-ann-title"
                    class="form-control"
                    value="${escapeHTML(item.title)}"
                >

            </div>


            <div class="form-group">

                <label>
                    Content
                </label>

                <textarea
                    id="edit-ann-content"
                    class="form-control"
                >${escapeHTML(item.content)}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Priority
                </label>

                <select
                    id="edit-ann-priority"
                    class="form-control"
                >

                    <option value="normal"
                        ${item.priority === "normal" ? "selected" : ""}>
                        Normal
                    </option>

                    <option value="low"
                        ${item.priority === "low" ? "selected" : ""}>
                        Low
                    </option>

                    <option value="high"
                        ${item.priority === "high" ? "selected" : ""}>
                        High
                    </option>

                    <option value="urgent"
                        ${item.priority === "urgent" ? "selected" : ""}>
                        Urgent
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Expiration Date
                </label>

                <input
                    type="date"
                    id="edit-ann-expires"
                    class="form-control"
                    value="${escapeHTML(item.expiresAt || "")}"
                >

            </div>
        `,
        () => {

            item.title =
                document.getElementById(
                    "edit-ann-title"
                ).value.trim();


            item.content =
                document.getElementById(
                    "edit-ann-content"
                ).value.trim();


            item.priority =
                document.getElementById(
                    "edit-ann-priority"
                ).value;


            item.expiresAt =
                document.getElementById(
                    "edit-ann-expires"
                ).value ||
                null;


            if (!item.title || !item.content) {

                showToast(
                    "Title and content are required."
                );

                return false;
            }


            saveState(state);

            showToast(
                "Announcement updated."
            );

            renderAnnouncements();

            return true;

        }
    );

}


/* =====================================================
   DELETE ANNOUNCEMENT
===================================================== */

function deleteAnnouncement(id) {

    if (
        !confirm(
            "Are you sure you want to delete this announcement?"
        )
    ) {
        return;
    }


    const state =
        getState();


    state.announcements =
        state.announcements.filter(
            item =>
                Number(item.id) !==
                Number(id)
        );


    saveState(state);

    renderAnnouncements();

    renderDashboard();

    showToast(
        "Announcement deleted."
    );

}



/* =====================================================
   SCHEDULE
===================================================== */

function renderSchedule() {

    const container =
        document.getElementById(
            "admin-schedule"
        );


    if (!container) {
        return;
    }


    const state =
        getState();


    if (!state.schedule.length) {

        container.innerHTML =
            emptyHTML(
                "📅",
                "No schedule",
                "There are currently no schedule entries."
            );

        return;
    }


    const sorted =
        [...state.schedule].sort(
            (a, b) =>
                String(
                    a.startDateTime || ""
                ).localeCompare(
                    String(
                        b.startDateTime || ""
                    )
                )
        );


    container.innerHTML =
        sorted
            .map(
                item => {

                    return `
                        <div class="admin-record">

                            <div class="record-top">

                                <div>

                                    <h3 class="record-title">
                                        ${escapeHTML(item.title || "Untitled Event")}
                                    </h3>

                                    <div class="record-meta">

                                        <span class="badge badge-normal">
                                            ${escapeHTML(item.eventType || "event")}
                                        </span>

                                        <span class="meta">
                                            📅 ${formatDateTime(item.startDateTime)}
                                        </span>

                                    </div>

                                </div>

                            </div>


                            <p class="record-content">
                                ${escapeHTML(item.description || "No description.")}
                            </p>


                            <div class="record-meta">

                                <span class="meta">
                                    📍 ${escapeHTML(item.location || "No location")}
                                </span>

                                ${
                                    item.celebrant
                                        ? `
                                            <span class="meta">
                                                ✝ ${escapeHTML(item.celebrant)}
                                            </span>
                                          `
                                        : ""
                                }

                            </div>


                            <div class="record-actions">

                                <button
                                    class="secondary-button"
                                    onclick="editSchedule(${Number(item.id)})"
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    class="danger-button"
                                    onclick="deleteSchedule(${Number(item.id)})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>
                    `;

                }
            )
            .join("");

}


/* =====================================================
   EDIT SCHEDULE
===================================================== */

function editSchedule(id) {

    const state =
        getState();

    const item =
        state.schedule.find(
            entry =>
                Number(entry.id) ===
                Number(id)
        );


    if (!item) {

        showToast(
            "Schedule entry not found."
        );

        return;
    }


    openModal(
        "Edit Schedule",
        "Update the schedule information.",
        `
            <div class="form-group">

                <label>
                    Title
                </label>

                <input
                    id="edit-sch-title"
                    class="form-control"
                    value="${escapeHTML(item.title)}"
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="edit-sch-description"
                    class="form-control"
                >${escapeHTML(item.description || "")}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Event Type
                </label>

                <select
                    id="edit-sch-type"
                    class="form-control"
                >

                    ${scheduleOption(
                        "mass",
                        "Mass",
                        item.eventType
                    )}

                    ${scheduleOption(
                        "event",
                        "Event",
                        item.eventType
                    )}

                    ${scheduleOption(
                        "special_mass",
                        "Special Mass",
                        item.eventType
                    )}

                    ${scheduleOption(
                        "novena",
                        "Novena",
                        item.eventType
                    )}

                    ${scheduleOption(
                        "confession",
                        "Confession",
                        item.eventType
                    )}

                    ${scheduleOption(
                        "other",
                        "Other",
                        item.eventType
                    )}

                </select>

            </div>


            <div class="form-group">

                <label>
                    Start Date & Time
                </label>

                <input
                    type="datetime-local"
                    id="edit-sch-start"
                    class="form-control"
                    value="${escapeHTML(item.startDateTime || "")}"
                >

            </div>


            <div class="form-group">

                <label>
                    End Date & Time
                </label>

                <input
                    type="datetime-local"
                    id="edit-sch-end"
                    class="form-control"
                    value="${escapeHTML(item.endDateTime || "")}"
                >

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    id="edit-sch-location"
                    class="form-control"
                    value="${escapeHTML(item.location || "")}"
                >

            </div>


            <div class="form-group">

                <label>
                    Celebrant
                </label>

                <input
                    id="edit-sch-celebrant"
                    class="form-control"
                    value="${escapeHTML(item.celebrant || "")}"
                >

            </div>
        `,
        () => {

            item.title =
                document.getElementById(
                    "edit-sch-title"
                ).value.trim();


            item.description =
                document.getElementById(
                    "edit-sch-description"
                ).value.trim();


            item.eventType =
                document.getElementById(
                    "edit-sch-type"
                ).value;


            item.startDateTime =
                document.getElementById(
                    "edit-sch-start"
                ).value;


            item.endDateTime =
                document.getElementById(
                    "edit-sch-end"
                ).value;


            item.location =
                document.getElementById(
                    "edit-sch-location"
                ).value.trim();


            item.celebrant =
                document.getElementById(
                    "edit-sch-celebrant"
                ).value.trim();


            if (
                !item.title ||
                !item.startDateTime
            ) {

                showToast(
                    "Title and start date are required."
                );

                return false;
            }


            saveState(state);

            renderSchedule();

            showToast(
                "Schedule updated."
            );

            return true;

        }
    );

}


function scheduleOption(
    value,
    label,
    selected
) {

    return `
        <option
            value="${value}"
            ${selected === value ? "selected" : ""}
        >
            ${label}
        </option>
    `;

}


/* =====================================================
   DELETE SCHEDULE
===================================================== */

function deleteSchedule(id) {

    if (
        !confirm(
            "Are you sure you want to delete this schedule?"
        )
    ) {
        return;
    }


    const state =
        getState();


    state.schedule =
        state.schedule.filter(
            item =>
                Number(item.id) !==
                Number(id)
        );


    saveState(state);

    renderSchedule();

    renderDashboard();

    showToast(
        "Schedule deleted."
    );

}


/* =====================================================
   POSTS
===================================================== */

function renderPosts() {

    const container =
        document.getElementById(
            "admin-posts"
        );


    if (!container) {
        return;
    }


    const state =
        getState();


    if (!state.posts.length) {

        container.innerHTML =
            emptyHTML(
                "📣",
                "No posts",
                "There are currently no parish posts."
            );

        return;
    }


    container.innerHTML =
        state.posts
            .map(
                item => {

                    return `
                        <div class="admin-record">

                            <div class="record-top">

                                <div>

                                    <h3 class="record-title">
                                        Parish Post #${Number(item.id)}
                                    </h3>

                                    <div class="record-meta">

                                        <span class="badge badge-${escapeHTML(item.status || "draft")}">
                                            ${escapeHTML(item.status || "draft")}
                                        </span>

                                        ${
                                            item.platforms
                                                ? item.platforms
                                                    .map(
                                                        platform =>
                                                            `<span class="meta">
                                                                ${escapeHTML(platform)}
                                                             </span>`
                                                    )
                                                    .join("")
                                                : ""
                                        }

                                    </div>

                                </div>

                            </div>


                            <p class="record-content">
                                ${escapeHTML(item.content || "")}
                            </p>


                            <div class="record-meta">

                                ${
                                    item.scheduledAt
                                        ? `
                                            <span class="meta">
                                                🗓 ${formatDateTime(item.scheduledAt)}
                                            </span>
                                          `
                                        : ""
                                }

                                ${
                                    item.publishedAt
                                        ? `
                                            <span class="meta">
                                                ✓ Published ${formatDateTime(item.publishedAt)}
                                            </span>
                                          `
                                        : ""
                                }

                            </div>


                            <div class="record-actions">

                                <button
                                    class="secondary-button"
                                    onclick="editPost(${Number(item.id)})"
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    class="danger-button"
                                    onclick="deletePost(${Number(item.id)})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>
                    `;

                }
            )
            .join("");

}


/* =====================================================
   EDIT POST
===================================================== */

function editPost(id) {

    const state =
        getState();

    const item =
        state.posts.find(
            entry =>
                Number(entry.id) ===
                Number(id)
        );


    if (!item) {

        showToast(
            "Post not found."
        );

        return;
    }


    const platforms =
        Array.isArray(item.platforms)
            ? item.platforms
            : [];


    openModal(
        "Edit Parish Post",
        "Update the post information.",
        `
            <div class="form-group">

                <label>
                    Post Content
                </label>

                <textarea
                    id="edit-post-content"
                    class="form-control"
                >${escapeHTML(item.content || "")}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select
                    id="edit-post-status"
                    class="form-control"
                >

                    ${postOption(
                        "draft",
                        "Draft",
                        item.status
                    )}

                    ${postOption(
                        "scheduled",
                        "Scheduled",
                        item.status
                    )}

                    ${postOption(
                        "published",
                        "Published",
                        item.status
                    )}

                </select>

            </div>


            <div class="form-group">

                <label>
                    Platforms
                </label>

                <div>

                    <label>
                        <input
                            type="checkbox"
                            id="platform-facebook"
                            ${platforms.includes("facebook") ? "checked" : ""}
                        >
                        Facebook
                    </label>

                    <br>

                    <label>
                        <input
                            type="checkbox"
                            id="platform-instagram"
                            ${platforms.includes("instagram") ? "checked" : ""}
                        >
                        Instagram
                    </label>

                    <br>

                    <label>
                        <input
                            type="checkbox"
                            id="platform-twitter"
                            ${platforms.includes("twitter") ? "checked" : ""}
                        >
                        Twitter
                    </label>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Scheduled At
                </label>

                <input
                    type="datetime-local"
                    id="edit-post-scheduled"
                    class="form-control"
                    value="${escapeHTML(item.scheduledAt || "")}"
                >

            </div>
        `,
        () => {

            item.content =
                document.getElementById(
                    "edit-post-content"
                ).value.trim();


            item.status =
                document.getElementById(
                    "edit-post-status"
                ).value;


            item.platforms = [];


            if (
                document.getElementById(
                    "platform-facebook"
                ).checked
            ) {

                item.platforms.push(
                    "facebook"
                );

            }


            if (
                document.getElementById(
                    "platform-instagram"
                ).checked
            ) {

                item.platforms.push(
                    "instagram"
                );

            }


            if (
                document.getElementById(
                    "platform-twitter"
                ).checked
            ) {

                item.platforms.push(
                    "twitter"
                );

            }


            item.scheduledAt =
                document.getElementById(
                    "edit-post-scheduled"
                ).value;


            if (
                !item.content ||
                !item.platforms.length
            ) {

                showToast(
                    "Post content and at least one platform are required."
                );

                return false;
            }


            saveState(state);

            renderPosts();

            showToast(
                "Post updated."
            );

            return true;

        }
    );

}


function postOption(
    value,
    label,
    selected
) {

    return `
        <option
            value="${value}"
            ${selected === value ? "selected" : ""}
        >
            ${label}
        </option>
    `;

}


/* =====================================================
   DELETE POST
===================================================== */

function deletePost(id) {

    if (
        !confirm(
            "Are you sure you want to delete this post?"
        )
    ) {
        return;
    }


    const state =
        getState();


    state.posts =
        state.posts.filter(
            item =>
                Number(item.id) !==
                Number(id)
        );


    saveState(state);

    renderPosts();

    renderDashboard();

    showToast(
        "Post deleted."
    );

}


/* =====================================================
   BOOKINGS
===================================================== */

let bookingFilter =
    "all";


function renderBookings() {

    const container =
        document.getElementById(
            "admin-bookings"
        );


    if (!container) {
        return;
    }


    const state =
        getState();


    let bookings =
        [...state.bookings];


    if (
        bookingFilter !==
        "all"
    ) {

        bookings =
            bookings.filter(
                item =>
                    item.status ===
                    bookingFilter
            );

    }


    if (!bookings.length) {

        container.innerHTML =
            emptyHTML(
                "🙏",
                "No bookings",
                "There are no booking requests under this filter."
            );

        return;
    }


    container.innerHTML =
        bookings
            .map(
                item => {

                    const status =
                        item.status ||
                        "pending";


                    const type =
                        item.service ||
                        item.type ||
                        item.serviceType ||
                        "Booking";


                    const name =
                        item.subject ||
                        item.name ||
                        item.fullName ||
                        item.bookingName ||
                        "No name provided";


                    const preferredDate =
                        item.preferredDate ||
                        item.date ||
                        item.bookingDate ||
                        item.eventDate ||
                        "";


                    return `
                        <div class="admin-record">

                            <div class="record-top">

                                <div>

                                    <h3 class="record-title">
                                        ${escapeHTML(name)}
                                    </h3>

                                    <div class="record-meta">

                                        <span class="badge badge-${escapeHTML(status)}">
                                            ${escapeHTML(status)}
                                        </span>

                                        <span class="meta">
                                            ${escapeHTML(type)}
                                        </span>

                                    </div>

                                </div>

                            </div>


                            <div class="record-meta">

                                <span class="meta">
                                    📅 Preferred:
                                    ${formatDate(preferredDate)}
                                </span>

                                ${
                                    item.alternateDate
                                        ? `
                                            <span class="meta">
                                                📅 Alternate:
                                                ${formatDate(item.alternateDate)}
                                            </span>
                                          `
                                        : ""
                                }

                                <span class="meta">
                                    📝 Requested:
                                    ${formatDate(item.createdAt)}
                                </span>

                            </div>


                            ${
                                item.notes
                                    ? `
                                        <p class="record-content">
                                            <strong>Notes:</strong>
                                            ${escapeHTML(item.notes)}
                                        </p>
                                      `
                                    : ""
                            }


                            ${
                                item.adminNotes
                                    ? `
                                        <p class="record-content">
                                            <strong>Admin Notes:</strong>
                                            ${escapeHTML(item.adminNotes)}
                                        </p>
                                      `
                                    : ""
                            }


                            ${
                                item.amount !== undefined
                                    ? `
                                        <div class="record-meta">
                                            <span class="meta">
                                                Amount:
                                                ₱${escapeHTML(item.amount)}
                                            </span>
                                        </div>
                                      `
                                    : ""
                            }


                            <div class="record-actions">

                                <button
                                    class="secondary-button"
                                    onclick="editBooking(${Number(item.id)})"
                                >
                                    ✏️ Manage
                                </button>

                                <button
                                    class="danger-button"
                                    onclick="deleteBooking(${Number(item.id)})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>
                    `;

                }
            )
            .join("");

}


/* =====================================================
   EDIT BOOKING
===================================================== */

function editBooking(id) {

    const state =
        getState();

    const item =
        state.bookings.find(
            entry =>
                Number(entry.id) ===
                Number(id)
        );


    if (!item) {

        showToast(
            "Booking not found."
        );

        return;
    }


    const name =
        item.subject ||
        item.name ||
        item.fullName ||
        item.bookingName ||
        "";


    const preferredDate =
        item.preferredDate ||
        item.date ||
        item.bookingDate ||
        item.eventDate ||
        "";


    const serviceType =
        item.serviceType ||
        item.type ||
        "";


    openModal(
        "Manage Booking",
        "Update the booking request without changing the original booking page.",
        `
            <div class="form-group">

                <label>
                    Service Type
                </label>

                <select
                    id="edit-book-type"
                    class="form-control"
                >

                    ${bookingOption(
                        "baptism",
                        "Baptism",
                        serviceType
                    )}

                    ${bookingOption(
                        "burial",
                        "Burial",
                        serviceType
                    )}

                    ${bookingOption(
                        "wedding",
                        "Wedding",
                        serviceType
                    )}

                    ${bookingOption(
                        "thanksgiving_mass",
                        "Thanksgiving Mass",
                        serviceType
                    )}

                    ${bookingOption(
                        "mass_request",
                        "Mass Request",
                        serviceType
                    )}

                    ${bookingOption(
                        "souls_mass",
                        "Souls Mass",
                        serviceType
                    )}

                    ${bookingOption(
                        "other",
                        "Other",
                        serviceType
                    )}

                </select>

            </div>


            <div class="form-group">

                <label>
                    Name / Subject
                </label>

                <input
                    id="edit-book-name"
                    class="form-control"
                    value="${escapeHTML(name)}"
                >

            </div>


            <div class="form-group">

                <label>
                    Preferred Date
                </label>

                <input
                    type="date"
                    id="edit-book-date"
                    class="form-control"
                    value="${escapeHTML(preferredDate)}"
                >

            </div>


            <div class="form-group">

                <label>
                    Alternate Date
                </label>

                <input
                    type="date"
                    id="edit-book-alt-date"
                    class="form-control"
                    value="${escapeHTML(item.alternateDate || "")}"
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select
                    id="edit-book-status"
                    class="form-control"
                >

                    ${bookingOption(
                        "pending",
                        "Pending",
                        item.status || "pending"
                    )}

                    ${bookingOption(
                        "confirmed",
                        "Confirmed",
                        item.status
                    )}

                    ${bookingOption(
                        "completed",
                        "Completed",
                        item.status
                    )}

                    ${bookingOption(
                        "cancelled",
                        "Cancelled",
                        item.status
                    )}

                </select>

            </div>


            <div class="form-group">

                <label>
                    Notes / Special Requests
                </label>

                <textarea
                    id="edit-book-notes"
                    class="form-control"
                >${escapeHTML(item.notes || "")}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Admin Notes
                </label>

                <textarea
                    id="edit-book-admin-notes"
                    class="form-control"
                >${escapeHTML(item.adminNotes || "")}</textarea>

            </div>
        `,
        () => {

            const newType =
                document.getElementById(
                    "edit-book-type"
                ).value;


            const newName =
                document.getElementById(
                    "edit-book-name"
                ).value.trim();


            const newDate =
                document.getElementById(
                    "edit-book-date"
                ).value;


            const newAltDate =
                document.getElementById(
                    "edit-book-alt-date"
                ).value;


            const newStatus =
                document.getElementById(
                    "edit-book-status"
                ).value;


            const newNotes =
                document.getElementById(
                    "edit-book-notes"
                ).value.trim();


            const newAdminNotes =
                document.getElementById(
                    "edit-book-admin-notes"
                ).value.trim();


            if (!newDate) {

                showToast(
                    "Preferred date is required."
                );

                return false;
            }


            /*
             * Preserve the existing booking
             * structure as much as possible.
             */

            item.type =
                newType;


            item.serviceType =
                item.serviceType !== undefined
                    ? newType
                    : item.serviceType;


            if (item.subject !== undefined) {
                item.subject =
                    newName;
            }

            if (item.name !== undefined) {
                item.name =
                    newName;
            }

            if (item.fullName !== undefined) {
                item.fullName =
                    newName;
            }

            if (item.bookingName !== undefined) {
                item.bookingName =
                    newName;
            }

            if (
                item.subject === undefined &&
                item.name === undefined &&
                item.fullName === undefined &&
                item.bookingName === undefined
            ) {

                item.subject =
                    newName;

            }


            if (
                item.preferredDate !== undefined
            ) {

                item.preferredDate =
                    newDate;

            } else if (
                item.date !== undefined
            ) {

                item.date =
                    newDate;

            } else if (
                item.bookingDate !== undefined
            ) {

                item.bookingDate =
                    newDate;

            } else if (
                item.eventDate !== undefined
            ) {

                item.eventDate =
                    newDate;

            } else {

                item.preferredDate =
                    newDate;

            }


            item.alternateDate =
                newAltDate;


            item.status =
                newStatus;


            item.notes =
                newNotes;


            item.adminNotes =
                newAdminNotes;


            saveState(state);

            renderBookings();

            renderDashboard();

            showToast(
                "Booking updated successfully."
            );

            return true;

        }
    );

}


function bookingOption(
    value,
    label,
    selected
) {

    return `
        <option
            value="${value}"
            ${selected === value ? "selected" : ""}
        >
            ${label}
        </option>
    `;

}


/* =====================================================
   DELETE BOOKING
===================================================== */

function deleteBooking(id) {

    if (
        !confirm(
            "Are you sure you want to permanently delete this booking?"
        )
    ) {
        return;
    }


    const state =
        getState();


    state.bookings =
        state.bookings.filter(
            item =>
                Number(item.id) !==
                Number(id)
        );


    saveState(state);

    renderBookings();

    renderDashboard();

    showToast(
        "Booking deleted successfully."
    );

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
    title,
    subtitle,
    content,
    saveFunction
) {

    const modal =
        document.getElementById(
            "admin-modal"
        );


    const titleElement =
        document.getElementById(
            "modal-title"
        );


    const subtitleElement =
        document.getElementById(
            "modal-subtitle"
        );


    const contentElement =
        document.getElementById(
            "modal-content"
        );


    const saveButton =
        document.getElementById(
            "modal-save"
        );


    titleElement.textContent =
        title;


    subtitleElement.textContent =
        subtitle;


    contentElement.innerHTML =
        content;


    modal.classList.add(
        "open"
    );


    saveButton.onclick =
        () => {

            const success =
                saveFunction();


            if (success !== false) {

                closeModal();

            }

        };

}


function closeModal() {

    const modal =
        document.getElementById(
            "admin-modal"
        );


    if (modal) {

        modal.classList.remove(
            "open"
        );

    }

}


/* =====================================================
   EMPTY HTML
===================================================== */

function emptyHTML(
    icon,
    title,
    description
) {

    return `
        <div class="empty-state">

            <div class="empty-state-icon">
                ${icon}
            </div>

            <h3>
                ${escapeHTML(title)}
            </h3>

            <p>
                ${escapeHTML(description)}
            </p>

        </div>
    `;

}


/* =====================================================
   EVENT LISTENERS
===================================================== */

function initializeAdmin() {

    if (!isAdminLoggedIn()) {

        window.location.href =
            "admin-login.html";

        return;
    }


    /* SIDEBAR */

    document
        .querySelectorAll(
            ".menu-item"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        showSection(
                            button.dataset.section
                        );

                    }
                );

            }
        );


    /* QUICK ACTIONS */

    document
        .querySelectorAll(
            "[data-go-section]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        showSection(
                            button.dataset.goSection
                        );

                    }
                );

            }
        );


    /* MOBILE MENU */

    const mobileMenu =
        document.getElementById(
            "mobile-menu"
        );


    const sidebar =
        document.getElementById(
            "sidebar"
        );


    if (
        mobileMenu &&
        sidebar
    ) {

        mobileMenu.addEventListener(
            "click",
            () => {

                sidebar.classList.toggle(
                    "open"
                );

            }
        );

    }


    /* LOGOUT */

    const logout =
        document.getElementById(
            "logout-button"
        );


    if (logout) {

        logout.addEventListener(
            "click",
            () => {

                if (
                    confirm(
                        "Do you want to logout?"
                    )
                ) {

                    adminLogout();

                }

            }
        );

    }


    /* MODAL CLOSE */

    document
        .getElementById(
            "modal-close"
        )
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById(
            "modal-cancel"
        )
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById(
            "admin-modal"
        )
        .addEventListener(
            "click",
            event => {

                if (
                    event.target.id ===
                    "admin-modal"
                ) {

                    closeModal();

                }

            }
        );


    /* REFRESH */

    document
        .getElementById(
            "refresh-announcements"
        )
        .addEventListener(
            "click",
            () => {

                renderAnnouncements();

                showToast(
                    "Announcements refreshed."
                );

            }
        );


    document
        .getElementById(
            "refresh-schedule"
        )
        .addEventListener(
            "click",
            () => {

                renderSchedule();

                showToast(
                    "Schedule refreshed."
                );

            }
        );


    document
        .getElementById(
            "refresh-posts"
        )
        .addEventListener(
            "click",
            () => {

                renderPosts();

                showToast(
                    "Posts refreshed."
                );

            }
        );


    document
        .getElementById(
            "refresh-bookings"
        )
        .addEventListener(
            "click",
            () => {

                renderBookings();

                showToast(
                    "Bookings refreshed."
                );

            }
        );


    /* BOOKING FILTER */

    document
        .querySelectorAll(
            ".booking-filter-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".booking-filter-button"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        bookingFilter =
                            button.dataset
                                .bookingFilter;


                        renderBookings();

                    }
                );

            }
        );


    /* INITIAL PAGE */

    showSection(
        "dashboard"
    );

}


/* =====================================================
   DETECT PAGE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if (
            document.getElementById(
                "admin-login-form"
            )
        ) {

            initializeLogin();

        }


        if (
            document.getElementById(
                "dashboard-section"
            )
        ) {

            initializeAdmin();

        }

    }
);


/* =====================================================
   CROSS-TAB REFRESH
   If another existing page changes
   dm_church_data, admin dashboard
   can refresh when focused.
===================================================== */

window.addEventListener(
    "storage",
    event => {

        if (
            event.key ===
            STORAGE_KEY
        ) {

            if (
                currentSection ===
                "dashboard"
            ) {

                renderDashboard();

            }

            if (
                currentSection ===
                "announcements"
            ) {

                renderAnnouncements();

            }

            if (
                currentSection ===
                "schedule"
            ) {

                renderSchedule();

            }

            if (
                currentSection ===
                "posts"
            ) {

                renderPosts();

            }

            if (
                currentSection ===
                "bookings"
            ) {

                renderBookings();

            }

        }

    }
);
</script>
