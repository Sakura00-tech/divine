<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Divine Mercy | Server Attendance</title>
<style>
:root{--red:#a91520;--red-dark:#7f111b;--red-soft:#fff1f2;--bg:#f4f6fa;--ink:#202633;--muted:#667085;--line:#e5e7eb;--green:#166534}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(circle at 10% 5%,#fee2e2 0,transparent 34%),linear-gradient(145deg,#f8fafc,#eef1f6);font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink)}
.card{width:min(100%,500px);background:#fff;border:1px solid rgba(148,163,184,.2);border-radius:24px;padding:clamp(22px,5vw,36px);box-shadow:0 22px 60px rgba(15,23,42,.10)}
.brand{text-align:center;color:var(--red);font-weight:900;letter-spacing:.12em;font-size:13px}.brand .cross{width:58px;height:58px;margin:0 auto 12px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,var(--red),var(--red-dark));color:#fff;font-size:30px;box-shadow:0 8px 20px #a9152030}
.sub{text-align:center;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.16em;margin:12px 0 28px}h1{font-size:clamp(23px,5vw,28px);text-align:center;margin:0 0 10px;letter-spacing:-.03em}.event{text-align:center;color:var(--red);font-weight:700;line-height:1.5;margin:0 auto 26px;padding:12px 14px;border:1px solid #fecdd3;background:var(--red-soft);border-radius:13px;max-width:100%}
#attendance-form{border-top:1px solid var(--line);padding-top:8px}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px;color:#344054}.field input,.field select{width:100%;padding:14px 15px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}.field input:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 4px #a9152014}.field input::placeholder{color:#98a2b3}
.btn{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;padding:15px 18px;font-size:15px;font-weight:800;margin-top:12px;box-shadow:0 8px 18px #a9152028;cursor:pointer;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-1px);box-shadow:0 11px 22px #a9152035}.btn:active{transform:translateY(0)}.note{font-size:12px;color:var(--muted);line-height:1.65;text-align:center;margin:20px 4px 0}.result{display:none;text-align:center;border-radius:14px;padding:20px;margin-top:20px;background:#ecfdf3;color:var(--green);line-height:1.65;border:1px solid #bbf7d0}.error{background:#fff1f2;color:#9f1239;border-color:#fecdd3}.hidden{display:none!important}
@media(max-width:420px){body{padding:14px}.card{border-radius:20px;padding:23px 19px}.sub{margin-bottom:23px}}
</style>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-bridge.js"></script>
</head><body><main class="card"><div class="brand"><div class="cross">✝</div>DIVINE MERCY</div><div class="sub">SERVER ATTENDANCE CHECK-IN</div><h1>Attendance Form</h1><div class="event" id="event-title">Loading event…</div>
<form id="attendance-form"><div class="field"><label for="server-name">Full Name</label><input id="server-name" name="name" required maxlength="100" autocomplete="name" placeholder="Enter your full name"></div><div class="field"><label for="ministry">Your Role</label><input id="ministry" name="role" required maxlength="100" autocomplete="organization-title" placeholder="Enter your role"></div><button class="btn" type="submit" id="submit-btn">Submit Attendance</button></form>
<div id="result" class="result" role="status"></div><p class="note">Your attendance confirmation will appear here. Attendance records and history are not available on this page.</p></main>
<script>
const STORAGE_KEY='dm_church_data';const params=new URLSearchParams(location.search);const eventId=params.get('event');let eventData=null;
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}}
function save(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function localTime(){return new Intl.DateTimeFormat('en-PH',{hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date())}
window.dmRefreshData().then(()=>{ const state=load();eventData=(state.attendanceEvents||[]).find(e=>e.id===eventId);
const eventTitle=document.getElementById('event-title');const form=document.getElementById('attendance-form');const result=document.getElementById('result');
if(!eventData){eventTitle.textContent='Invalid or unavailable event QR';form.classList.add('hidden');result.textContent='Please scan a valid QR code provided by the parish.';result.classList.add('error');result.style.display='block'}else{eventTitle.textContent=eventData.name+' • '+eventData.date}
form.addEventListener('submit',async e=>{e.preventDefault();if(!eventData)return;const name=document.getElementById('server-name').value.trim();const ministry=document.getElementById('ministry').value.trim();if(!name||!ministry)return;
const button=document.getElementById('submit-btn');button.disabled=true;button.textContent='Recording…';
try{const resultCode=await window.dmRecordAttendance({eventId,name,ministry,date:localDate(),time:localTime()});
if(resultCode==='time_in'){result.className='result';result.innerHTML='<strong>Time In recorded!</strong><br>Thank you for serving. Please scan this event QR again when your service is finished to record Time Out.';}
else if(resultCode==='time_out'){result.className='result';result.innerHTML='<strong>Time Out recorded!</strong><br>Thank you for your service. Your attendance is complete.';}
else if(resultCode==='already_completed'){result.className='result';result.innerHTML='<strong>Attendance already completed.</strong><br>Your Time In and Time Out have already been recorded.';}
else if(resultCode==='invalid_event'){throw new Error('This attendance event is no longer active. Please ask the parish administrator.');}
else{throw new Error('Unable to record attendance. Please check the details and try again.');}
result.style.display='block';form.classList.add('hidden');
}catch(error){result.className='result error';result.textContent=error.message||'Attendance could not be recorded. Please try again.';result.style.display='block';button.disabled=false;button.textContent='Submit Attendance';}
});
});
</script></body></html>
