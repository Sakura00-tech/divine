<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;min-height:100vh;display:flex;align-items:center;justify-content:center}.forgot-card{width:min(92%,420px);background:#fff;border:1px solid #b91c1c;border-radius:14px;padding:32px;box-shadow:0 12px 35px rgba(0,0,0,.10);text-align:center}.forgot-card .logo{font-size:40px;margin-bottom:8px}.forgot-card h1{margin:0 0 8px;color:#7f1d1d}.forgot-card p{margin:0 0 24px;color:#666;line-height:1.5}.forgot-card label{display:block;text-align:left;font-weight:600;margin-bottom:7px;color:#333}.forgot-card input{width:100%;padding:12px;border:1px solid #b91c1c;border-radius:8px;font-size:15px;outline:none}.forgot-card input:focus{box-shadow:0 0 0 3px rgba(185,28,28,.14)}.forgot-card button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#b91c1c;color:#fff;font-weight:700;cursor:pointer}.forgot-card button:hover{background:#7f1d1d}.back{display:inline-block;margin-top:16px;color:#b91c1c;text-decoration:none;font-weight:600;font-size:14px}
</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-bridge.js"></script>
</head>
<body>
<div class="forgot-card">
<div class="logo">✝</div>
<h1>Forgot Password</h1>
<p>Enter the parish email address to request a password reset.</p>
<form id="reset-form">
<label for="email">Parish Email</label>
<input id="email" type="email" placeholder="Enter parish email" required>
<button type="submit">Send Reset Request</button>
</form>
<p id="reset-message" aria-live="polite"></p>
<script>
document.getElementById("reset-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const button = this.querySelector("button");
  const message = document.getElementById("reset-message");
  button.disabled = true;
  const {error} = await window.dmSendPasswordReset(email);
  button.disabled = false;
  message.textContent = error ? error.message : "If this email belongs to an account, a password reset email has been sent.";
});
</script>
<a class="back" href="admin-login.html">Back to Login</a>
</div>
</body>
</html>
